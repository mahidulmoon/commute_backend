apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fast-api-micro
  labels:
    app: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: fast-api-micro/queue-service:latest
        imagePullPolicy: Never
        workingDir: /app
        command: ["python", "-m", "app.worker"]
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: fast-api-micro
spec:
  selector:
    app: worker
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP