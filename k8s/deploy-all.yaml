---
# Worker Service (RabbitMQ Consumer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fast-api-micro
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: fast-api-micro/queue-service:latest
        workingDir: /app
        command: ["python", "-m", "app.worker"]
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "1000m"

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fast-api-micro
spec:
  selector:
    app: rabbitmq
  ports:
  - port: 5672
    targetPort: 5672
  - port: 15672
    targetPort: 15672

