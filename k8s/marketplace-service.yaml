apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-service
  namespace: fast-api-micro
  labels:
    app: marketplace-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace-service
  template:
    metadata:
      labels:
        app: marketplace-service
    spec:
      containers:
      - name: marketplace-service
        image: fast-api-micro/marketplace-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-service
  namespace: fast-api-micro
spec:
  selector:
    app: marketplace-service
  ports:
  - name: http
    port: 8084
    targetPort: 8084
  type: ClusterIP