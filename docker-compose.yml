version: '3.9'

services:
  auth_service:
    build: ./auth_service
    ports:
      - "8000:8000"
    volumes:
      - ./auth_service:/app
    env_file:
      - ./auth_service/.env
    networks:
      - app-network

  worker:
    build: ./queue_service
    container_name: rabbitmq_worker
    working_dir: /app
    command: python -m app.worker
    volumes:
      - ./queue_service:/app
      - ./logs:/app/logs
    environment:
      - RABBITMQ_URL=amqp://user:password@192.168.0.100:5672/
      - AUTH_DB_URL=postgresql://user:secret@192.168.0.100:5432/auth_service?sslmode=disable
    
  
  post_service:
    build: ./api_service
    ports:
      - "8082:8082"
    volumes:
      - ./api_service:/app
    env_file:
      - ./api_service/.env
    networks:
      - app-network

  chat_service:
    build: ./chat_service
    ports:
      - "8083:8083"
    volumes:
      - ./chat_service:/app
    env_file:
      - ./chat_service/.env
    networks:
      - app-network

  marketplace_service:
    build: ./marketplace_service
    ports:
      - "8084:8084"
    volumes:
      - ./marketplace_service:/app
    env_file:
      - ./marketplace_service/.env
    networks:
      - app-network

  notification_service:
    build: ./notification_service
    ports:
      - "8085:8085"
    volumes:
      - ./notification_service:/app
    env_file:
      - ./notification_service/.env
    networks:
      - app-network

  upload_service:
    build: ./upload_service
    ports:
      - "8086:8086"
    volumes:
      - ./upload_service:/app
      # - uploads_data:/app/uploads
    env_file:
      - ./upload_service/.env
    networks:
      - app-network

  # db_auth:
  #   image: postgres:15
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_DB: vidlist_ai
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: 1234
  #   volumes:
  #     - pgdata_auth:/var/lib/postgresql/data
  #   networks:
  #     - app-network


volumes:
  pgdata_auth:
  pgdata_api:
  esdata:
  uploads_data:

networks:
  app-network:
    driver: bridge

